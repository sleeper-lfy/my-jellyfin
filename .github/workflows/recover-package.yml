name: Recover explicitly requested verified package delivery
on:
  push:
    branches: [main]
    paths: ['scripts/recover-package-request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-package-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original successful Windows job, APK and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/recover-package-delivery.py
      - name: Save recovered matching target packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- target
          git commit -m "Recover delivery of original verified 0.4.7 packages [skip ci]"
          git push origin HEAD:main
