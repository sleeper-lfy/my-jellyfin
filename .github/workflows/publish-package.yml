name: Publish explicitly requested verified package
on:
  push:
    branches: [main]
    paths: ['scripts/publish-package-release.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original build and publish the same EXE and APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish-package-release.py
      - name: Save publication outcome
        if: always()
        shell: bash
        run: |
          if ! git diff --quiet -- target/release-status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add target/release-status.json
            git commit -m "Record explicitly requested publication of verified packages [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
