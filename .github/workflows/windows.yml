name: Windows build and verification
on:
  push:
    branches: [main]
    paths-ignore: ['target/**']
  pull_request:
    paths-ignore: ['target/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg using verified package-manager download
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-windows-x64
          path: dist/Lumen-windows-x64.zip

  publish-target:
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-windows-x64
          path: .local/windows-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package into target
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/package-target.py .local/windows-artifact/Lumen-windows-x64.zip target --revision "$SOURCE_COMMIT"
      - name: Commit Windows package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add target/windows-package.json target/Lumen-windows-x64.zip.part*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified Windows package to target [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
