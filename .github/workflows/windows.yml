name: Windows verification and manual packaging
on:
  push:
    branches: [main]
    paths-ignore: ['target/**']
  pull_request:
    paths-ignore: ['target/**']
  workflow_dispatch:
    inputs:
      package:
        description: 'Explicitly build the Windows installer'
        type: boolean
        default: false
      publish:
        description: 'Explicitly publish the installer to Releases (requires package)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit packaging request
        if: inputs.publish && !inputs.package
        run: throw 'Publishing requires an explicit packaging request'
      - name: Verify source without packaging
        if: ${{ !inputs.package }}
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Source verification failed' }
      - name: Install FFmpeg using verified package-manager download
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: pwsh
        run: |
          choco install ffmpeg innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg / Inno Setup installation failed' }
      - name: Build and test
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build and verify EXE installer
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: pwsh
        run: |
          ./scripts/build-installer-windows.ps1
          ./scripts/verify-installer-windows.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.package
        with:
          name: Lumen-windows-x64
          path: |
            dist/Lumen-windows-x64.zip
            dist/installer/Lumen-Setup-x64.exe
            dist/installer/Lumen-Setup-x64.exe.sha256
            dist/installer/acceptance.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-diagnostics
          path: |
            .local/installer-test.log
            .local/test-results.xml
            .local/pc-acceptance.json
            .local/installer-verification.json
          if-no-files-found: ignore

  publish-target:
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.package && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-windows-x64
          path: .local/windows-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package into target
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          PYTHONPATH=src python -m lumen.release_acceptance check --report docs/validation/windows-release-acceptance.json --installer .local/windows-artifact/installer/Lumen-Setup-x64.exe --require-release
          python scripts/package-installer-target.py .local/windows-artifact/installer/Lumen-Setup-x64.exe target --revision "$SOURCE_COMMIT"
      - name: Publish single-file installer download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="windows-${SOURCE_COMMIT:0:12}"
          installer=".local/windows-artifact/installer/Lumen-Setup-x64.exe"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" "$installer.sha256" --clobber
          else
            gh release create "$tag" "$installer" "$installer.sha256" --target "$SOURCE_COMMIT" --title "Lumen Windows + Android ${SOURCE_COMMIT:0:12}" --notes "Windows x64 installer with SHA-256 checksum. Source commit: $SOURCE_COMMIT. Windows 10+."
          fi
      - name: Commit Windows package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- target
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified Windows installer to target [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
