name: Explicitly retry publication of verified installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/release-request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the explicit retry request and unchanged source
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/prepare-release-retry.py
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: .local/release-windows
          run-id: ${{ steps.request.outputs.windows_run_id }}
          github-token: ${{ github.token }}
      - name: Verify Android integrity and signing certificate
        run: |
          mkdir -p .local/release-diagnostics
          {
            python scripts/verify-android-target.py
            python scripts/verify-android-signature.py
          } 2>&1 | tee .local/release-diagnostics/android-verification.log
      - name: Prepare verified Windows delivery files
        env:
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
        run: python scripts/package-installer-target.py .local/release-windows/Lumen-Setup-x64.exe target --revision "$SOURCE_COMMIT"
      - name: Publish both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: python scripts/publish-release.py 2>&1 | tee .local/release-diagnostics/publication.log
      - name: Record outcome and commit verified delivery files
        if: always() && steps.request.outcome == 'success'
        env:
          WINDOWS_RESULT: success
          PUBLISH_RESULT: ${{ job.status }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          python scripts/report-release.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- target
          git commit -m "Deliver explicitly requested release and record publication outcome [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
