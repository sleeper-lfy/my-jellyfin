name: Android verification and manual packaging
on:
  push:
    paths-ignore: ['target/**']
  pull_request:
    paths-ignore: ['target/**']
  workflow_dispatch:
    inputs:
      package:
        description: 'Explicitly build the Android APK'
        type: boolean
        default: false
      publish:
        description: 'Explicitly publish the APK to Releases (requires package)'
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent development signing key when configured
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            mkdir -p .local
            printf '%s' "$SIGNING_KEY" | base64 --decode > .local/android-debug.keystore
            echo "LUMEN_ANDROID_KEYSTORE=$GITHUB_WORKSPACE/.local/android-debug.keystore" >> "$GITHUB_ENV"
          fi
      - name: Validate explicit packaging request
        if: inputs.publish && !inputs.package
        run: exit 1
      - name: Install verified build tools
        id: sdk
        shell: bash
        run: |
          python -m pip install httpx==0.28.1
          python scripts/setup-android-cloud.py 2>&1 | tee android-sdk.log
      - name: Compile, lint and test without packaging
        id: compile
        shell: bash
        run: |
          python scripts/build-android-cloud.py :app:lintDebug :app:testDebugUnitTest 2>&1 | tee android-build.log
      - name: Build APK only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: python scripts/build-android-cloud.py :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Lumen-android-diagnostics
          path: |
            android-sdk.log
            android-build.log
            android/app/build/reports/
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.package
        with:
          name: Lumen-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  publish-apk:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.package && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-android-debug
          path: .local/android-artifact
      - name: Publish APK without waiting for the Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="windows-${SOURCE_COMMIT:0:12}"
          apk=".local/android-artifact/Lumen-android-debug.apk"
          mv .local/android-artifact/app-debug.apk "$apk"
          cd .local/android-artifact && sha256sum Lumen-android-debug.apk > Lumen-android-debug.apk.sha256 && cd ../..
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$tag" "$apk" "$apk.sha256" --target "$SOURCE_COMMIT" --title "Lumen Windows + Android ${SOURCE_COMMIT:0:12}" --notes "Android debug APK with SHA-256 checksum. Windows packaging and publication require a separate explicit request. Android 8.0+ / Windows 10+."
          fi
