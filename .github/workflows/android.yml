name: Android
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        id: sdk
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 2>&1 | tee android-sdk.log
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and test
        id: compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee ../android-build.log
        working-directory: android
      - name: Save failure diagnostics
        if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci-android-report.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add target/android-ci-failure.json
          if git diff --cached --quiet; then exit 0; fi
          git -c core.fileMode=false commit -m "Report Android CI failure [skip ci]"
          git -c core.fileMode=false pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Lumen-android-diagnostics
          path: |
            android-sdk.log
            android-build.log
            android/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  publish-apk:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the tested APK and its source
        run: python scripts/verify-android-target.py
      - name: Publish APK without waiting for the Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="windows-${SOURCE_COMMIT:0:12}"
          apk="target/Lumen-android-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$tag" "$apk" "$apk.sha256" --target "$SOURCE_COMMIT" --title "Lumen Windows + Android ${SOURCE_COMMIT:0:12}" --notes "Android debug APK with SHA-256 checksum. The Windows installer is added automatically after Windows build and installer verification succeed. Android 8.0+ / Windows 10+."
          fi
