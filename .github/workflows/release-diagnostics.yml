name: Inspect requested release build failures
on:
  push:
    branches: [work]
    paths: ['scripts/release-diagnostics-request.json']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repository test IDs and fixed exception categories only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '### Structured release test diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python scripts/release-test-diagnostics.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
