name: Inspect requested release build failures
on:
  push:
    branches: [work]
    paths: ['scripts/release-diagnostics-request.json']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect bounded redacted failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/release-diagnostics-request.json scripts/ci-inspect.json
          python scripts/inspect-ci.py
      - name: Show bounded redacted evidence
        run: |
          echo '### Release failure evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 target/ci-inspection.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
